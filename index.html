<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="An AI-powered teaching platform under Catalyst Creative. AI-Powered Teaching. Smarter Tomorrow. Aligned with NaCCA Standards." />
    <meta property="og:title" content="TeachSmartGH" />
    <meta property="og:description" content="An AI-powered teaching platform under Catalyst Creative. AI-Powered Teaching. Smarter Tomorrow. Aligned with NaCCA Standards." />
    <meta name="keywords" content="Ghana Education Service, NaCCA, GES, Lesson Plan Ghana, Scheme of Learning Ghana, TeachSmart Ghana, JHS curriculum, Primary school curriculum, lesson notes generator, terminal exam paper, educational worksheets, Ghanaian teachers" />
    <title>TeachSmartGH | AI-Powered Teaching. Smarter Tomorrow.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A192F" />

    <!-- Performance: Preconnect & Load Google Fonts without blocking CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" />
    
    <!-- Mobile PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TeachSmartGH" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <script>
      // Capture PWA beforeinstallprompt at the earliest millisecond before React hydration
      window.__teachsmart_deferred_prompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__teachsmart_deferred_prompt = e;
        window.dispatchEvent(new CustomEvent('teachsmart:pwa-prompt-ready', { detail: e }));
        console.log('[PWA] Early install prompt captured');
      });
      window.addEventListener('appinstalled', function () {
        window.__teachsmart_deferred_prompt = null;
        window.dispatchEvent(new CustomEvent('teachsmart:pwa-installed'));
        console.log('[PWA] App installation completed');
      });

      // Gracefully prevent non-fatal dev server websocket reconnection errors from bubbling
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (
          (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
          (event.reason.message && event.reason.message.includes('WebSocket'))
        )) {
          event.preventDefault();
        }
      });
    </script>
    
    <!-- Google Adsense (Non-blocking Deferred Loading) -->
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var s = document.createElement('script');
          s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7910254103007139";
          s.crossOrigin = "anonymous";
          s.async = true;
          document.head.appendChild(s);
        }, 1200);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
